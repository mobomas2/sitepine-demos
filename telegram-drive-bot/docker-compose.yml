services:
  bot:
    build: .
    container_name: tg-drive-bot
    restart: unless-stopped
    env_file: .env
    # اگر از Service Account استفاده می‌کنی، فایل JSON را mount کن:
    # volumes:
    #   - ./service_account.json:/app/service_account.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
