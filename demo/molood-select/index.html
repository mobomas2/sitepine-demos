<title>انتخاب محتوای سایت جدید — خانم مولودزاده</title>
<style>
:root{--ink:#151a1f;--mute:#6b7480;--line:#e3e7eb;--brand:#0f5c6b;--ok:#1c7a4a;--no:#8a2f2f;--chg:#8a6d1f;--mg:#5a4a8a;--bg:#f6f8fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.85}
button{font-family:inherit;font-size:15px;cursor:pointer;border:0;background:none}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(165deg,#0f5c6b,#0b3742)}
.card{background:#fff;border-radius:18px;padding:26px 22px;max-width:420px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.card h1{font-size:20px;margin:0 0 6px}.card p{color:var(--mute);font-size:14px;margin:0 0 18px}
input[type=tel]{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:20px;text-align:center;letter-spacing:6px;font-family:inherit}
.btn-main{width:100%;background:var(--brand);color:#fff;padding:14px;border-radius:12px;margin-top:12px;font-weight:700;font-size:16px}
.err{color:var(--no);font-size:14px;margin-top:10px;min-height:20px;text-align:center}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px 10px}
header.top .h{display:flex;justify-content:space-between;align-items:center;gap:10px}header.top b{font-size:15px}
.prog{font-size:13px;color:var(--mute)}
.bar{height:5px;background:#eceff2;border-radius:5px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);width:0}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fbfcfd;color:var(--brand)}
.search{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13.5px}
main{padding:14px 12px 130px;max-width:760px;margin:0 auto}
section{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
section>summary{padding:14px 16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
section>summary::-webkit-details-marker{display:none}section>summary h2{font-size:16px;margin:0}
section>summary .n{font-size:12.5px;color:var(--mute);white-space:nowrap}
.hint{font-size:12.5px;color:var(--mute);padding:0 16px 10px;margin:0}
.bulk{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
.bulk button{font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fbfcfd}
.bulk button.yes{color:var(--ok);border-color:#c9e3d6}.bulk button.no{color:var(--no);border-color:#eccfcf}
.item{padding:12px 16px;border-top:1px solid var(--line)}
.item .t{font-size:15px;font-weight:600;line-height:1.6}
.item .m{font-size:11.5px;color:var(--mute);margin:2px 0 6px}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin:0 0 6px}
.rec.keep{background:#e8f5ee;color:var(--ok)}.rec.update{background:#fbf6e6;color:var(--chg)}
.rec.merge{background:#eeecf7;color:var(--mg)}.rec.delete{background:#fbeeee;color:var(--no)}
.why{font-size:12px;color:#5b6672;margin:0 0 8px}
.item .x{font-size:13px;color:#3f4a55;margin-bottom:10px;display:none;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.95}
.item.open .x{display:block}
.cbox{background:#fff8f2;border:1px solid #f0dcc9;border-radius:10px;padding:9px 11px;margin:8px 0 0;font-size:12.5px}
.cbox b{font-size:12px;color:#8a5a1f;display:block;margin-bottom:4px}
.cbox div{margin:2px 0}
.item .opts{display:flex;gap:6px;flex-wrap:wrap}
.item .opts button{padding:7px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:13.5px;background:#fff;color:#3c4650}
.item[data-v=yes] .opts button[data-a=yes]{background:#e8f5ee;border-color:#9fd3b8;color:var(--ok);font-weight:700}
.item[data-v=no] .opts button[data-a=no]{background:#fbeeee;border-color:#e3b4b4;color:var(--no);font-weight:700}
.item[data-v=change] .opts button[data-a=change]{background:#fbf6e6;border-color:#ddc98d;color:var(--chg);font-weight:700}
.item textarea{display:none;width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13.5px;min-height:64px;resize:vertical}
.item[data-v=change] textarea{display:block}
.more{font-size:12px;color:var(--brand);background:none;padding:0;margin-bottom:6px;border-bottom:1px dashed #cfe0e4}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:30}
footer .s{font-size:12px;color:var(--mute);flex:1;line-height:1.5}
footer .go{background:var(--brand);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px}
.contactcard{background:#fff;border:1px solid #f0dcc9;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.contactcard h2{font-size:15px;margin:0 0 4px;color:#8a5a1f}
.contactcard p{font-size:12.5px;color:var(--mute);margin:0 0 10px}
.contactcard table{width:100%;border-collapse:collapse;font-size:12.5px}
.contactcard td{padding:5px 6px;border-top:1px solid #f6ece2;vertical-align:top}
.contactcard td:first-child{white-space:nowrap;color:#8a5a1f;font-weight:700;width:80px}
.contactcard .w{display:block;color:var(--mute);font-size:11px;margin-top:2px}
#result{position:fixed;inset:0;background:#fff;z-index:50;overflow:auto;display:none;padding:18px 16px 40px}
#result.on{display:block}#result h2{font-size:19px;margin:0 0 4px}
#result h3{font-size:15px;margin:20px 0 6px;color:var(--brand)}
#result ul{margin:0;padding-right:20px;font-size:13.5px}#result li{margin:3px 0}
#result .acts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 8px}
#result .acts button{padding:11px 14px;border-radius:11px;border:1.5px solid var(--line);font-size:14px;background:#fff}
#result .acts .primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
#result pre{white-space:pre-wrap;background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;font-family:inherit;max-height:220px;overflow:auto}
.warnbox{background:#fff8f6;border:1px solid #edd3cc;border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:13px}
.toast{position:fixed;bottom:80px;right:50%;transform:translateX(50%);background:#151a1f;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:60}
.toast.on{opacity:1}
</style>

  <div id="resBody"></div>
</div>

اشید تا به این سوال پاسخ دهیم. اگر به دلیل اعتیاد همسر خود دعوای طلاق اقامه کرده اید و همسر شما به مواد مخدر اعتیاد دارد ولیکن در آزمایش های معمولی که انجام می شود مانند آزمایش ادرار با حیله های متفاوت جواب آزمایش را منفی می­کند، یک راهکار درخواست آزمایش مو از مرجع قضایی است. نکته جالب اینکه این نوع آزمایش، مصرف فرد را تا سه ماه قبل نشان می دهد. البته با گذشت زمان، راه های گریز از مثبت شدن جواب این آزمایش نیز برای معتادان به دست می آید اما براحتی حیله در آزمایش های دیگر نیست. آزمایش مو در تشخیص اعتیاد یکی از روش های است که در آن حیله وجود ندارد و سختگیری می شود.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"439","t":"در صورت فروش ملک توسط صاحبخانه، آیا مستاجر باید با صاحبخانه جدید مجدد قرارداد تنظیم کند؟","d":"2021-12-17","w":72,"x":"زمانی که فروشنده مالکِ ملک بوده و اقدام به انجام تعهد کرده یعنی قرارداد اجاره ای تنظیم نموده طرفین باید نسبت به آن پایبند باشند، بنابراین بعد از هر گونه نقل و انتقال بر روی ملکِ مورد اجاره، حقوق ایجاد شده برای مستاجر تا زمان انقضاء قرارداد اجاره پا برجا می‌باشد و نه تنها تنظیم قرارداد جدیدی لازم نیست، بلکه مالک جدید تا انقضای مدت قرارداد، نمی تواند مستاجر را بلند کند.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"440","t":"اگر ماموران بدون حکم اقدام به تفتیش کنند، آیا موضوع قابل پیگیری قانونی است؟","d":"2021-12-16","w":94,"x":"ماموران نیروی انتظامی حق ندارند در جرایم غیر مشهود اقدام به بازرسی اتومبیل‌ها کنند و حتی دستور کلی مقام قضائی هم در این مورد کفایت نمی‌کند. بلکه هرگاه نیاز به بازرسی اتومبیل باشد باید مشخصات و نحوه‌ی بازرسی آن در دستور مقام قضائی ذکر شود. زیرا مطابق اصل ۲۲ قانون اساسی همچنین ماده ۵۵ قانون آیین دادرسی کیفری، تفتیش و بازرسی از منازل و وسایل نقلیه و به طور کلی اموال و اجناس مردم بدون اینکه اتهامی متوجه آن‌ها باشد تعرض به حقوق ملت به شمار می‌رود و از نظر قانون اساسی ممنوع است.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"441","t":"امتناع از بیمه کردن کارگر چه حکمی دارد؟","d":"2021-12-17" ی فاقد گواهینامه معتبر رانندگی باشد حتی اگر بیمه حادثه ویژه راننده هم داشته باشد، دیه و خسارت از طریق شرکت های بیمه به وی تعلق نمی گیرد. این رای راجع به اشخاص ثالث نیست و اشخاص ثالث در تصادفات رانندگی حتی اگر راننده گواهینامه نداشته باشد، مستحق دریافت دیه و خسارت هستند.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"445","t":"آیا چک های موسسات اعتباری،‌ آثار حقوقی سایر بانک ها را دارند؟","d":"2021-12-12","w":51,"x":"آن چه که عموم مردم به عنوان\" چک موسسات مالی و اعتباری و صندوق های قرض الحسنه \" می شناسند تابع قانون صدور چک و یک سند بانکی لازم الاجرا نیست، این برگه یک حواله یا سند عادی است و صرفا از طریق حقوقی و طبق قانون تجارت قابل پیگرد است.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"446","t":"مجازات قذف و توهین چیست؟","d":"2021-12-19","w":138,"x":"مجازات قذف و توهین موضوعی است که در این مطلب به آن می پردازیم در صورت نسبت دادن زنا یا لواط به شخص دیگر، نسبت به کسی که زنا یا لواط متوجّه او شده، جرم قذف و نسبت به مخاطب جرم توهین محقّق شده است. با استناد به ماده ی 252 قانون مجازات اسلامی 1392. مطابق این مادّه: کسی که به قصد نسبت دادن زنا یا لواط به دیگری، الفاظی غیر از زنا یا لواط به کار ببرد که صریح در انتساب زنا یا لواط به افرادی از قبیل همسر، پدر، مادر، خواهر یا برادر مخاطب باشد نسبت به کسی که زنا یا لواط به او نسبت داده شده است ، محکوم به حدّ قذف (یعنی ۸۰ ضربه شلاق) و درباره‌ی مخاطب اگر به علّت این حکم اذیت شود، به مجازات توهین (یعنی حبس ) محکوم می شود.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"447","t":"آیا ضبط مکالمات تلفنی جرم است؟","d":"2021-12-19","w":66,"x":"منظور از ضبط مکالمات تلفنی این است که یک نفر از طرف های تماس بدون اطلاع دادن به شخص مقابل گفتگوهای مابین را ضبط کند. به موجب قانون، صرف ضبط مکالمات جرم محسوب نمی شود ولی اگر مرتکب با سوء استفاده از مکالمات ضبط شده آن را وسیله ارتکاب جرایمی مانند تهدید و اخاذی قرار دهد، تحت عناوین خاص خود، تحت تعقیب کیفری قرار خواهد گرفت.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"448","t":"معنای اسناد مالکیت معارض چیست؟","d":"2021-12-14","w":68,"x":"اسناد مالکیت معارض موضوع مورد بررسی می باشد اگر دو سند مالکیت، به صورت جزیی و یا کلی از نظر اصل ملکی که موضوع آنهاست یا از نظر حدود ملک یا حقوق ارتفاقی با هم تعارض داشته باشند و این تعارض با رای هیات نظارت موضوع ماده ۶ قانون ثبت احراز شود، سند مالکیتی که ثبت آن نسبت به دیگری موخر است سند مالکیت معارض تلقی می شود.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"449","t":"به چه کسی ولی قهری می گویند؟","d":"2021-12-19","w":64,"x":"ولی قهری: ولی قهری عبارت است از پدر و جد پدری شخص. اختیارات ولی قهری عام است و هر اقدامی را که به مصلحت کودک باشد در برمی‌گیرد، ایشان نماینده قانونی کودک در تمام امور و مسایل مربوط به اموال و حقوق مالی بوده و اختیاراتش نامحدود است. به‌طور مثال ولی قهری می‌تواند مال طفل را بفروشد و با پول آن معامله‌هایی انجام دهد.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"450","t":"فرم رضایت نامه پزشکی چیست؟","d":"2021-12-19","w":109,"x":"فرم رضایت نامه پزشکی پزشک قبل از شروع به اقدام تشخیصی و درمانی ، خطرات احتمالی را به بیمار یا ولی او تذکر می دهد و کتبا رضایت اخذ نماید تا در صورت بروز خسارت جانی به بیمار ،مسئول و مدیون نباشد. با اخذ رضایت نامه به پزشک اجازه داده می شود تا بر اساس تخصص و صلاحیت خود بتواند در مقام تشخیص یا درمان، بیمار را با توجه به موازین علمی در معرض آسیب های احتمالی و لازم با روش های طبی قراردهد. چنانچه بیمار در طی درمان دچار عوارض یا نقص عضوی گردد در صورتی که پزشک براساس موازین علمی و فنی عمل کرده باشد مقصر نیست.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"451","t":"چه کسانی  ممنوع الخروج هستند؟","d":"2021-12-19","w":118,"x":"چه کسانی ممنوع الخروج هستند؟ سوالی است که به آن پاسخ می دهیم. افرادی که بدهکاری قطعی مالیاتی دارند. بدهكارانی كه به موجب صدور حكم قطعی دادگاه یا صدور اجرائیه در اجرای ثبت سازمان ثبت اسناد و املاك، بدهی آن ها محرز شده. اشخاصی که در خارج از کشور به دلیل تكدی ولگردی، سرقت، كلاهبرداری و هرعنوان دیگری دارای سوء شهرت باشند. كسانی كه مسافرت آنها به خارج از كشور به تشخیص مقامات قضایی مخالف مصالح جمهوری اسلامی ایران باشد، كسانی كه به موجب اعلام كتبی مقامات قضایی حق خروج از كشور را ندارند. افرادی كه اخذ گذرنامه و خروج از كشور آنها به اراده فرد دیگری مانند (پدر،شوهر و…) محول شده است. جز افراد ممنوع الخروج هستند.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"539","t":"چرا اخذ کد رهگیری املاک مهم است؟","d":"2021-12-24","w":78,"x":"دریافت کد رهگیری املاک این اطمینان را به شما می‌دهد که ملک مورد معامله بدون اشکال است و قرارداد آن معتبر خواهد بود. اگرچه مشاوران املاک از سالیان دور از این نوع مبایعه نامه‌ها برای خرید و اجاره خانه استفاده می‌کنند، اما این مبایعه نامه‌ها از ضمانت و اطمینان کافی برخوردار نیستند و تنها به عنوان یک پیش‌نویس در معاملات مسکن می‌توان از آنها بهره برد و برای اعتبار قرارداد‌ها حتما نیاز به دریافت کد رهگیری املاک است.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"540","t":"مجازات قتل در تصادفات رانندگی چیست؟","d":"2021-12-26","w":101,"x":"اغلب مردم تصور می کنند که مجازات راننده‌ای که سبب قتل در تصادف رانندگی شده است، قصاص است در صورتی که طبق قانون این گونه نیست. تصادفات به وسیله اتومبیل و فوت ناشی از آن امروزه شمار زیادی از مرگ و میر‌ها را در بر می‌گیرد. قتل در تصادفات رانندگی در میان انواع قتل، قتل غیرعمد محسوب می‌شود و مجازات قصاص ندارد بلکه باید دیه پرداخت شود. در واقع می‌توان گفت قتل در تصادفات رانندگی اگر به علت های: بی‌احتیاطی یا بی‌مبالاتی، رعایت نکردن قواعد و مقررات رانندگی و مهارت نداشتن راننده وسیله نقلیه رخ دهد، قتل غیر عمد محسوب می‌شود.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[{"k":"تلفن","v":"00122318202"}]},{"id":"542","t":"چه افرادی می توانند کودک و یا نوجوانی را از سازمان بهزیستی به سرپرستی بگیرند؟","d":"2021-12-22","w":76,"x":"زن و شوهری که پنج سال از تاریخ ازدواج آنان گذشته باشد و از این ازدواج صاحب فرزند نشده باشند، مشروط به این که حداقل یکی از آنان بیش از سی سال سن داشته باشد. زن و شوهر دارای فرزند، مشروط بر این که حداقل یکی از آنان بیش از سی سال سن داشته باشد. دختران و زنان بدون شوهر، در صورتی که حداقل سی سال سن داشته باشند، منحصرا حق سرپرستی دختران را خواهند داشت.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"543","t":"اعتراض به جرائم راهنمایی و رانندگی در چه شرایطی امکان پذیر است؟","d":"2021-12-28","w":95,"x":"در تخلفات رانندگی، چنانچه فرد متخلف به جریمه‌ی خود اعتراض داشته باشد، باید مراتب اعتراض خود را ظرف مدت شصت روز با ذکر دلایل به اداره‌ی اجرائیات راهنمایی‌ و‌ رانندگی تسلیم نماید. اداره‌ی اجرائیات راهنمایی و رانندگی موظف است اعتراضات را بررسی نموده و در صورت غیر‌موجه دانستن اعتراض، مراتب را به معترض ابلاغ نماید. در صورت اصرار معترض، اداره اجرائیات موضوع را جهت رسیدگی به واحد رسیدگی به اعتراضات ناشی از تخلفات رانندگی ارسال می کند. واحد رسیدگی به اعتراضات ناشی از تخلفات رانندگی پس از بررسی موضوع مبادرت به صدور رأی قطعی می‌نماید.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"544","t":"اگر فعالیت صرافی های ارز دیجیتال طبق قانون ممنوع شود، آیا معامله گران قبلی، مورد پیگرد قانونی قرار می‌گیرند؟","d":"2021-12-30","w":127,"x":"خیر. قانون عطف به ما سبق نخواهد شد. یعنی اگر قانون فعالیت صرافی‌ها را ممنوع کند، از لحظه تصویب و ابلاغ فعالیت‌ها مجرمانه شناخته خواهد شد. افرادی که پیش از تصویب قانون در این بازارها فعالیت داشته ‌اند، عمل مجرمانه ‌ای انجام نداده ‌اند. در نظر داشته باشید که تا امروز چنین قانونی تصویب نشده است. پس تا زمان مشخص شدن وضعیت صرافی‌ها و مبادلات ارز دیجیتال، خرید و فروش ارز دیجیتال غیرقانونی نیست. به عبارت دیگر خرید و فروش ارزهای دیجیتال در صورتی جرم محسوب می‌شود که برای انجام کارهای غیر قانونی مورد استفاده باشد. در واقع، معامله و نگهداری رمزارزها اگر ابزار جرم نباشد، جرم نیست. لازم به ذکر است جرایم حوزه‌ی ارزهای دیجیتال مثل سایر جرایم اینترنتی از طریق پلیس فتا قابل پیگیری است.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"545","t":"در چه صورت، زوج ها پس از طلاق نیز از همدیگر ارث می برند؟","d":"2022-01-01","w":139,"x":"در دو صورت: در صورت طلاق رجعی ... . طلاق بر دو قسم است: طلاق بائن و طلاق رجعی که هر کدام از این دو طلاق آثار مختلفی نیز دارند. در طلاق بائن برای شوهر حق رجوع نیست اما در طلاق رجعی برای شوهر در مدت عده حق رجوع است. در طلاق رجعی، زن و مرد همچنان زن و شوهر به شمار می روند. بند ۲ ماده ۸ قانون امور حسبی در این خصوص بیان می دارد: زوجه ای که در عده طلاق رجعی است در حکم زوجه است. در ماده ۹۴۴ ق.م نیز ذکر شده است که اگر شوهر در حال مرض، زن خود را طلاق دهد و در ظرف یک سال از تاریخ طلاق به همان مرض بمیرد زوجه او از اموالش ارث می برد اگر چه طلاق بائن باشد مشروط بر اینکه زن، شوهر نکرده باشد.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"546","t":"چگونه بفهمیم خودروی ما به پارکینگ منتقل شده یا به سرقت رفته است؟","d":"2022-01-03","w":117,"x":"معاون اجتماعی پلیس راهور فاتب: اگر خودرو به پارکینگ منتقل شود پیامک انتقال خودرو برای مالک خودرو ارسال می‌شود. اگر بعد از انتقال خودرو به پارکینگ برای راننده ای پیامک ارسال نشده است دو دلیل دارد یکی اینکه ماشین قولنامه‌ای خریداری شده و شماره مالک تغییر نکرده و دیگری اینکه اطلاعات راننده در سامانه به روز نیست یعنی شماره مالک جدید خودرو در سامانه ثبت نشده است. اگر راننده به محل پارک خودرواش مراجعه کرد و خودرو را نیافت و پیامک انتقال خودرو به پارکینگ هم برایش ارسال نشد می تواند با ۱۱۰ تماس بگیرد تا همکاران ما همان لحظه از مرفوک راهور استعلام بگیرند و به او بگویند که خودرو به پارکینگ منتقل شده یا خیر.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"547","t":"آیا می توان سارق را کتک زد؟","d":"2022-01-05","w":149,"x":"ممکن است تاکنون موارد بسیاری را شنیده یا تجربه کرده باشید که سارق شبانه وارد منزل شخصی شده و در همین حین ساکنین در منزل متوجه حضور او در منزل می شوند. حال سوال اینجا است که ساکنین منزل در این موقعیت چگونه می توانند از خود و اموال شان در برابر سارق دفاع کنند. به عبارت دیگر ساکنین می توانند به سارق حمله ور شده و او را مورد ضرب و جرح قرار دهند؟ ارتکاب بسیاری از اعمال نظیر ضرب و جرح عمدی و بدون دلیل افراد بر اساس قوانین جزایی کشور جرم تلقی شده و طبیعی است ضارب مستوجب تحمل مجازات و پرداخت دیه خواهد بود. اما تحت شرایطی خاص قانون گذار این عمل را از حالت مجرمانه خارج ساخته و فرد را مستوجب مجازات نمی داند. یکی از این موارد دفاع مشروع است که توضیح تکمیلی آن در بخش مقالات همین وب سایت در دسترس است.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"548","t":"مهر و موم ترکه به چه معناست؟","d":"2022-01-09","w":116,"x":"مهر و موم ترکه موضوعی است که قصد بررسی آن را داریم. از لحاظ حقوقی، عبارت از اقدامی که توسط مراجع قضایی انجام می گیرد تا ورثه از هرگونه استفاده و دخل و تصرف در ترکه ممنوع ‌شوند و این امر به منظور حفظ و نگهداری از ترکه انجام میشود. مهر و موم ترکه صرفا با درخواست هر یک از ورثه متوفی یا نماینده قانونی آنان، موصی ‌له در صورتی که وصیت به جزء مشاع شده باشد، طلبکار متوفی و وصی انجام می شود و همین افراد نیز حق رفع مهر و موم ترکه را دارند. درخواست رفع آن نیز به دو صورت بدون تنظیم ریز ترکه یا با درخواست تنظیم‌ ریز ترکه انجام می گیرد.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"549","t":"چگونه می توان برای افراد ساکن خارج از ایران حکم جلب گرفت؟","d":"2022-01-07","w":126,"x":"شهروندی که دنبال شکایت از فردی در خارج از کشور باشد باید به دادگاه مراجعه کند و در آنجا به طرح دعوا بپردازد. قاضی هم، چون آن فردی که مورد شکایت قرار گرفته در خارج از کشور به سر می‌برد به اینترپل می‌نویسد که این فرد باید تحت تعقیب قرار بگیرد. سپس پلیس اینترپل برای صدور اعلام قرمز براساس دستور قاضی اقدام می‌کند و آن فرد را تحت تعقیب قرار می‌دهد. درواقع این اقدامات از مسیر قوه قضائیه شکل می‌گیرد و به ما می‌رسد. رئیس پلیس بین الملل ناجا در پاسخ به اینکه آیا شهروندان برای طرح شکایت از افراد مقیم خارج از کشور باید هزینه‌ای پرداخت کنند گفت: هیچ هزینه‌ای پرداخت نمی‌شود. چون انجام اقدامات مربوط به این کار جزء وظایف پلیس اینترپل محسوب می‌شود.","k":"faq","rc":"keep","rl":"نگه دار","rw":"کوتاه اما مفید و بی‌زمان است.","c":[]},{"id":"550","t":"شاهد و شرایط شهادت","d":"2022-01-10","w":95,"x":"ماده ۱۷۷ قانون مجازات اسلامی: شاهد شرعی در زمان ادای شهادت باید شرایط زی ور امارات هستند می­توانند درخواست دسته چک بدهند و با رعایت قوانین مربوط به چک، معاملات تجاری و اقتصادی خود…","k":"faq","rc":"keep","rl":"نگه دار","rw":"همیشه‌سبز است و دقیقاً به بازار فعلی شما (امارات) مربوط می‌شود.","c":[]},{"id":"2374","t":"آیا وجود تمکن مالی جهت گرفتن اقامت امارات ضروری است؟","d":"2023-03-13","w":121,"x":"در حال حاضر مقرراتی مبنی بر الزام داشتن تمکن مالی جهت اخذ اقامت امارات ارائه نداده است اما این موضوع یک امر بدیهی است و بهتر است ایرانیانی که قصد اخذ مجوز اقامت امارات را دارند با داشتن سرمایه لازم قدم در این راه بگذارند تا بتوانند از شرایط سخت احتمالی که دولت امارات برای شهروندان ایرانی قرار می­دهد عبور کنند. مبلغی که برای اثبات تمکن مالی لازم است در اختیار داشته باشید و آن را در بانک­ های امارات قرار دهید معمولاً دربازه حدود ۵۰ تا ۱۰۰ هزار درهم است که می تواند کارایی لازم را برای اثبات سرمایه تان داشته باشد. گفتنی است بعد از افتتاح حساب، بهتر است مقدار 10 هزار درهم را در حساب خود باقی بگذارید.","k":"faq","rc":"keep","rl":"نگه دار","rw":"همیشه‌سبز است و دقیقاً به بازار فعلی شما (امارات) مربوط می‌شود.","c":[]},{"id":"2375","t":"آیا امکان رهن خانه در امارات وجود دارد؟","d":"2023-03-20","w":134,"x":"در کشور امارات خانه­ ها فقط به صورت اجاره ­ای به افراد متقاضی واگذار می­شوند و قراردادی با عنوان رهن وجود ندارد. قوانینی که برای اجاره دادن منازل مسکونی در این کشور وجود دارد در تمام شهرهای امارات به صورت یکسان اجرا می­شود. معمولاً خانه­ هایی که به افراد متقاضی اجاره داده می­شوند تا مدت یک سال قرارداد دارند و لغو این قرارداد توسط هر یک از طرفین مشمول پرداخت جریمه میشود. افراد صاحب خانه در این کشور غالباً مبلغ اجاره را از قبل دریافت می­کنند و بهای معادل 3 ماه اجاره را به عنوان ضمانت نزد خود نگه می­دارند. افراد مستاجر می توانند این مبالغ را به صورت چک در اختیار فرد صاحب ملک قرار دهند که تعداد چک­ های ارائه شده با توجه به توافقی که میان طرفین صورت می‌گیرد تعیین می­شود.","k":"faq","rc":"keep","rl":"نگه دار","rw":"همیشه‌سبز است و دقیقاً به بازار فعلی شما (امارات) مربوط می‌شود.","c":[]},{"id":"2376","t":"آیا ثبت شرکت در امارات شامل مالیات می شود؟","d":"2023-     <div class="m">${it.d} · ${w}</div>
    <p class="why">${esc(it.rw)}</p>
    ${it.x ? `<button class="more">نمایش متن</button><div class="x">${esc(it.x)}${cbox}</div>` : (cbox ? `<div class="x" style="display:block">${cbox}</div>` : "")}
    <div class="opts">
      <button data-a="yes">می‌خواهم</button>
      <button data-a="no">نمی‌خواهم</button>
      <button data-a="change">با تغییر</button>
    </div>
    <textarea placeholder="چه تغییری لازم است؟">${esc(note)}</textarea>
  </div>`;
}

function contactPanel(){
  if (!DATA.contacts.length) return "";
  const rows = DATA.contacts.map(c => `<tr><td>${esc(c.k)}</td><td>${esc(c.v)}<span class="w">${esc(c.where.join(" · "))}</span></td></tr>`).join("");
  return `<div class="contactcard">
    <h2>اطلاعات تماسی که الان روی سایت است</h2>
    <p>این‌ها از متن صفحه‌ها استخراج شده و <b>تأیید نشده‌اند</b>. لطفاً بگویید کدام‌ها هنوز درست‌اند و کدام باید عوض شود. ${DATA.contactsTotal > DATA.contacts.length ? "(« + fa(DATA.contactsTotal - DATA.contacts.length) + » مورد کم‌تکرار دیگر هم داخل خود کارت‌ها، زیر «نمایش متن» دیده می‌شود.)" : ""}</p>
    <table>${rows}</table>
  </div>`;
}

function render(){
  const q = (document.getElementById("search").value || "").trim();
  const main = document.getElementById("main");
  let html = contactPanel();
  DATA.groups.forEach((g, gi) => {
    const items = g.items.filter(it => !q || it.t.includes(q));
    if (!items.length) return;
    const done = g.items.filter(it => state[it.id]?.v).length;
    html += `<details ${q || gi < 3 ? "open" : ""}>
      <summary><h2>${esc(g.title)}</h2><span class="n">${fa(items.length)} مورد · ${fa(done)} انتخاب‌شده</span></summary>
      ${g.hint ? `<p class="hint">${esc(g.hint)}</p>` : ""}
      <div class="bulk" data-g="${g.key}">
        <button class="yes" data-b="yes">همه: می‌خواهم</button>
        <button class="no" data-b="no">همه: نمی‌خواهم</button>
        <button data-b="clear">پاک کردن این بخش</button>
      </div>
      ${items.map(itemHTML).join("")}
    </details>`;
  });
  main.innerHTML = html;
  updateProgress();
}

function updateProgress(){
  const total = all.length;
  const done = all.filter(it => state[it.id]?.v).length;
  const yes = all.filter(it => state[it.id]?.v === "yes").length;
  const chg = all.filter(it => state[it.id]?.v === "change").length;
  document.getElementById("prog").textContent = fa(done) + " از " + fa(total);
  document.getElementById("barFill").style.width = (done/total*100).toFixed(1) + "%";
  document.getElementById("foot").textContent = "می‌خواهم " + fa(yes) + " · با تغییر " + fa(chg) + " · بی‌پاسخ " + fa(total - done);
}

document.getElementById("main").addEventListener("click", e => {
  const t = e.target;
  const item = t.closest(".item");
  if (t.classList.contains("more") && item){
    item.classList.toggle("open");
    t.textContent = item.classList.contains("open") ? "بستن متن" : "نمایش متن";
    return;
  }
  if (t.dataset.a && item){
    const id = item.dataset.id, cur = state[id]?.v, v = (cur === t.dataset.a) ? "" : t.dataset.a;
    state[id] = { v, n: state[id]?.n || "" };
    item.dataset.v = v; save(); updateProgress(); return;
  }
  const b = t.dataset.b;
  if (b){
    const g = DATA.groups.find(x => x.key === t.closest(".bulk").dataset.g);
    g.items.forEach(it => { if (b === "clear") delete state[it.id]; else state[it.id] = { v: b, n: state[it.id]?.n || "" }; });
    save(); render(); return;
  }
});
document.getElementById("main").addEventListener("input", e => {
  if (e.target.tagName === "TEXTAREA"){
    const item = e.target.closest(".item"), id = item.dataset.id;
    state[id] = { v: state[id]?.v || "change", n: e.target.value };
    item.dataset.v = state[id].v; save(); updateProgress();
  }
});
document.getElementById("search").addEventListener("input", () => render());

document.getElementById("applyRecBtn").onclick = () => {
  if (!confirm("پیشنهاد ما برای همهٔ موارد اعمال شود؟ (می‌توانید بعداً هر کدام را عوض کنید)")) return;
  all.forEach(it => {
    if (it.rc === "delete") state[it.id] = { v: "no", n: "" };
    else if (it.rc === "keep") state[it.id] = { v: "yes", n: "" };
    else state[it.id] = { v: "change", n: state[it.id]?.n || (it.rc === "update" ? "به‌روزرسانی لازم است" : "ادغام با مورد مشابه") };
  });
  save(); render(); toast("پیشنهادها اعمال شد");
};

function buildText(){
  const now = new Date();
  const L = ["نتیجهٔ انتخاب محتوای سایت جدید — خانم مولودزاده",
             "تاریخ: " + now.toLocaleDateString("fa-IR") + " — " + now.toLocaleTimeString("fa-IR").slice(0,5), ""];
  DATA.groups.forEach(g => {
    const yes = g.items.filter(it => state[it.id]?.v === "yes");
    const chg = g.items.filter(it => state[it.id]?.v === "change");
    const no  = g.items.filter(it => state[it.id]?.v === "no");
    const emp = g.items.filter(it => !state[it.id]?.v);
    L.push("■ " + g.title + "  (کل " + g.items.length + " | می‌خواهم " + yes.length + " | با تغییر " + chg.length + " | نمی‌خواهم " + no.length + " | بی‌پاسخ " + emp.length + ")");
    if (yes.length) L.push("  می‌خواهم: " + yes.map(x => x.t).join(" / "));
    if (chg.length) chg.forEach(x => { const n = (state[x.id] && state[x.id].n) || ""; L.push("  با تغییر: " + x.t + (n ? " ← " + n : " ← بدون توضیح")); });
    if (no.length) L.push("  نمی‌خواهم: " + no.map(x => x.t).join(" / "));
    L.push("");
  });
  L.push("یادداشت: ۶ نوشتهٔ اسپم قدیمی (شرط‌بندی/کازینو) در هیچ حالتی بازگردانده نمی‌شود.");
  L.push("اطلاعات تماس: لطفاً تأیید شود (بخش «اطلاعاتی که الان روی سایت است»).");
  return L.join("\n");
}

function openResult(){
  document.getElementById("result").classList.add("on");
  window.__txt = buildText();
  document.getElementById("resMeta").textContent = "این نتیجه را کپی کنید یا فایلش را ذخیره کنید و برای مسعود بفرستید.";
  let body = "";
  DATA.groups.forEach(g => {
    const yes = g.items.filter(it => state[it.id]?.v === "yes");
    const chg = g.items.filter(it => state[it.id]?.v === "change");
    const no  = g.items.filter(it => state[it.id]?.v === "no");
    body += `<h3>${esc(g.title)}</h3><div style="font-size:12.5px;color:#6b7480">می‌خواهم ${fa(yes.length)} · با تغییر ${fa(chg.length)} · نمی‌خواهم ${fa(no.length)}</div>`;
    if (yes.length) body += `<ul>${yes.map(x => `<li>${esc(x.t)}</li>`).join("")}</ul>`;
    if (chg.length) body += `<ul>${chg.map(x => `<li><b>${esc(x.t)}</b> — ${esc((state[x.id] && state[x.id].n) || "بدون توضیح")}</li>`).join("")}</ul>`;
  });
  body += `<h3>متن آمادهٔ ارسال</h3><pre>${esc(window.__txt)}</pre>`;
  document.getElementById("resBody").innerHTML = body;
}
document.getElementById("goBtn").onclick = openResult;
document.getElementById("backBtn").onclick = () => document.getElementById("result").classList.remove("on");

function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); }
document.getElementById("copyBtn").onclick = async () => {
  const txt = window.__txt || buildText();
  try { await navigator.clipboard.writeText(txt); toast("کپی شد — در تلگرام بفرستید"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("کپی شد"); }
};
document.getElementById("dlBtn").onclick = () => {
  const blob = new Blob([window.__txt || buildText()], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "انتخاب-محتوا.txt"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
};
document.getElementById("tgBtn").onclick = () => {
  const txt = (window.__txt || buildText()).slice(0, 900);
  window.open("https://t.me/share/url?url=" + encodeURIComponent(location.href) + "&text=" + encodeURIComponent(txt), "_blank");
};
document.getElementById("resetBtn").onclick = () => {
  if (!confirm("همهٔ انتخاب‌ها پاک شود؟")) return;
  state = {}; save(); document.getElementById("result").classList.remove("on"); render();
};
</script>
</body>
</html>
