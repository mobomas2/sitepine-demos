<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>انتخاب محتوای سایت جدید — خانم مولودزاده</title>
<style>
:root{--ink:#151a1f;--mute:#6b7480;--line:#e3e7eb;--brand:#0f5c6b;--brand2:#0d4954;--ok:#1c7a4a;--no:#8a2f2f;--chg:#8a6d1f;--bg:#f6f8fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.85}
button{font-family:inherit;font-size:15px;cursor:pointer;border:0;background:none}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(165deg,#0f5c6b,#0b3742)}
.card{background:#fff;border-radius:18px;padding:26px 22px;max-width:420px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.card h1{font-size:20px;margin:0 0 6px}
.card p{color:var(--mute);font-size:14px;margin:0 0 18px}
input[type=tel],input[type=text]{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:20px;text-align:center;letter-spacing:6px;font-family:inherit}
.btn-main{width:100%;background:var(--brand);color:#fff;padding:14px;border-radius:12px;margin-top:12px;font-weight:700;font-size:16px}
.err{color:var(--no);font-size:14px;margin-top:10px;min-height:20px;text-align:center}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px 10px}
header.top .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
header.top b{font-size:15px}
.prog{font-size:13px;color:var(--mute)}
.bar{height:5px;background:#eceff2;border-radius:5px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0}
.search{margin-top:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px}
main{padding:14px 12px 120px;max-width:760px;margin:0 auto}
section{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
section>summary{padding:14px 16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
section>summary::-webkit-details-marker{display:none}
section>summary h2{font-size:16px;margin:0}
section>summary .n{font-size:12.5px;color:var(--mute);white-space:nowrap}
.hint{font-size:12.5px;color:var(--mute);padding:0 16px 10px;margin:0}
.bulk{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
.bulk button{font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fbfcfd}
.bulk button.yes{color:var(--ok);border-color:#c9e3d6}
.bulk button.no{color:var(--no);border-color:#eccfcf}
.item{padding:12px 16px;border-top:1px solid var(--line)}
.item .t{font-size:15px;font-weight:600;line-height:1.6}
.item .m{font-size:11.5px;color:var(--mute);margin:2px 0 6px}
.item .x{font-size:12.5px;color:#4a5560;margin-bottom:8px;display:none}
.item.open .x{display:block}
.item .opts{display:flex;gap:6px;flex-wrap:wrap}
.item .opts button{padding:7px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:13.5px;background:#fff;color:#3c4650}
.item[data-v=yes] .opts button[data-a=yes]{background:#e8f5ee;border-color:#9fd3b8;color:var(--ok);font-weight:700}
.item[data-v=no] .opts button[data-a=no]{background:#fbeeee;border-color:#e3b4b4;color:var(--no);font-weight:700}
.item[data-v=change] .opts button[data-a=change]{background:#fbf6e6;border-color:#ddc98d;color:var(--chg);font-weight:700}
.item textarea{display:none;width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13.5px;min-height:64px;resize:vertical}
.item[data-v=change] textarea{display:block}
.more{font-size:12px;color:var(--brand);background:none;padding:0;margin-bottom:6px}
footer{bottom:0;position:fixed;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:30}
footer .s{font-size:12.5px;color:var(--mute);flex:1;line-height:1.5}
footer .go{background:var(--brand);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px}
#result{position:fixed;inset:0;background:#fff;z-index:50;overflow:auto;display:none;padding:18px 16px 40px}
#result.on{display:block}
#result h2{font-size:19px;margin:0 0 4px}
#result h3{font-size:15px;margin:20px 0 6px;color:var(--brand)}
#result ul{margin:0;padding-right:20px;font-size:13.5px}
#result li{margin:3px 0}
#result .acts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 8px}
#result .acts button{padding:11px 14px;border-radius:11px;border:1.5px solid var(--line);font-size:14px;background:#fff}
#result .acts .primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
#result pre{white-space:pre-wrap;background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;font-family:inherit;max-height:220px;overflow:auto}
.warnbox{background:#fff8f6;border:1px solid #edd3cc;border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:13px}
.toast{position:fixed;bottom:80px;right:50%;transform:translateX(50%);background:#151a1f;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:60}
.toast.on{opacity:1}
@media print{footer,header.top{display:none}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <h1>انتخاب محتوای سایت جدید</h1>
    <p>خانم مولودزاده، رمز چهاررقمی را وارد کنید.</p>
    <input id="pw" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
    <button class="btn-main" id="pwBtn">ورود</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app" style="display:none">
<header class="top">
  <div class="h"><b>انتخاب محتوا</b><span class="prog" id="prog">۰ از ۰</span></div>
  <div class="bar"><i id="barFill"></i></div>
  <input class="search" id="search" placeholder="جست‌وجو در عنوان‌ها…">
</header>
<main id="main"></main>
<footer>
  <div class="s" id="foot">هر مورد را یکی از سه حالت را انتخاب کنید.</div>
  <button class="go" id="goBtn">دیدن نتیجه</button>
</footer>
</div>

<div id="result">
  <h2>نتیجهٔ انتخاب شما</h2>
  <div style="color:#6b7480;font-size:13px" id="resMeta"></div>
  <div class="acts">
    <button class="primary" id="copyBtn">کپی نتیجه</button>
    <button id="dlBtn">ذخیرهٔ فایل</button>
    <button id="tgBtn">ارسال در تلگرام</button>
    <button id="backBtn">بازگشت</button>
    <button id="resetBtn" style="color:#8a2f2f">پاک کردن</button>
  </div>
  <div id="resBody"></div>
</div>
<div class="toast" id="toast"></div>

const PASS = "4842";
const KEY = "molood-pick-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };
const fa = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

/* --- gate --- */
function unlock(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  try { sessionStorage.setItem("molood-unlocked","1"); } catch(e){}
  render();
}
document.getElementById("pwBtn").onclick = () => {
  const v = document.getElementById("pw").value.trim();
  if (v === PASS) unlock();
  else { document.getElementById("pwErr").textContent = "رمز درست نیست."; document.getElementById("pw").value = ""; }
};
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("pwBtn").click(); });
try { if (sessionStorage.getItem("molood-unlocked") === "1") unlock(); } catch(e){}

/* --- render --- */
const all = [];
DATA.groups.forEach(g => g.items.forEach(it => all.push(it)));

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function itemHTML(it){
  const v = state[it.id]?.v || "";
  const note = state[it.id]?.n || "";
  const w = it.w ? fa(it.w) + " کلمه" : "بدون متن";
  return `<div class="item" data-id="${it.id}" data-v="${v}">
    <div class="t">${esc(it.t)}</div>
    <div class="m">${it.d} · ${w}</div>
    ${it.x ? `<button class="more">نمایش متن</button><div class="x">${esc(it.x)}</div>` : ""}
    <div class="opts">
      <button data-a="yes">می‌خواهم</button>
      <button data-a="no">نمی‌خواهم</button>
      <button data-a="change">با تغییر</button>
    </div>
    <textarea placeholder="چه تغییری لازم است؟">${esc(note)}</textarea>
  </div>`;
}

function render(){
  const q = (document.getElementById("search").value || "").trim();
  const main = document.getElementById("main");
  let html = "";
  DATA.groups.forEach((g, gi) => {
    const items = g.items.filter(it => !q || it.t.includes(q));
    if (!items.length) return;
    const done = g.items.filter(it => state[it.id]?.v).length;
    html += `<details ${q ? "open" : (gi < 3 ? "open" : "")} ${g.key==="posts_fa"?"":""}>
      <summary><h2>${esc(g.title)}</h2><span class="n">${fa(items.length)} مورد · ${fa(done)} انتخاب‌شده</span></summary>
      ${g.hint ? `<p class="hint">${esc(g.hint)}</p>` : ""}
      <div class="bulk" data-g="${g.key}">
        <button class="yes" data-b="yes">همه: می‌خواهم</button>
        <button class="no" data-b="no">همه: نمی‌خواهم</button>
        <button data-b="clear">پاک کردن این بخش</button>
      </div>
      ${items.map(itemHTML).join("")}
    </details>`;
  });
  if (DATA.spam.length){
    html += `<div class="warnbox"><b>۶ نوشتهٔ اسپم (مال شما نیست)</b><br>
      این‌ها در سال ۲۰۲۰ به سایت تزریق شده‌اند و دربارهٔ شرط‌بندی و کازینو هستند. در سایت جدید نمی‌آیند و فقط برای اطلاع شما اینجا آمده‌اند.</div>`;
  }
  main.innerHTML = html;
  updateProgress();
}

function updateProgress(){
  const total = all.length;
  const done = all.filter(it => state[it.id]?.v).length;
  document.getElementById("prog").textContent = fa(done) + " از " + fa(total);
  document.getElementById("barFill").style.width = (done/total*100).toFixed(1) + "%";
  const yes = all.filter(it => state[it.id]?.v === "yes").length;
  const chg = all.filter(it => state[it.id]?.v === "change").length;
  document.getElementById("foot").textContent = "می‌خواهم: " + fa(yes) + " · با تغییر: " + fa(chg) + " · بی‌پاسخ: " + fa(total - done);
}

document.getElementById("main").addEventListener("click", e => {
  const t = e.target;
  const item = t.closest(".item");
  if (t.classList.contains("more") && item){ item.classList.toggle("open"); return; }
  if (t.dataset.a && item){
    const id = item.dataset.id;
    const cur = state[id]?.v;
    const v = (cur === t.dataset.a) ? "" : t.dataset.a;
    state[id] = { v, n: state[id]?.n || "" };
    item.dataset.v = v;
    save(); updateProgress(); return;
  }
  const b = t.dataset.b;
  if (b){
    const key = t.closest(".bulk").dataset.g;
    const g = DATA.groups.find(x => x.key === key);
    g.items.forEach(it => {
      if (b === "clear") delete state[it.id];
      else state[it.id] = { v: b, n: state[it.id]?.n || "" };
    });
    save(); render(); return;
  }
});
document.getElementById("main").addEventListener("input", e => {
  if (e.target.tagName === "TEXTAREA"){
    const item = e.target.closest(".item");
    const id = item.dataset.id;
    state[id] = { v: state[id]?.v || "change", n: e.target.value };
    if (!state[id].v) { state[id].v = "change"; item.dataset.v = "change"; }
    save(); updateProgress();
  }
});
document.getElementById("search").addEventListener("input", () => render());

/* --- result --- */
function buildText(){
  const now = new Date();
  const d = now.toLocaleDateString("fa-IR") + " — " + now.toLocaleTimeString("fa-IR").slice(0,5);
  const L = ["نتیجهٔ انتخاب محتوای سایت جدید — خانم مولودزاده", "تاریخ: " + d, ""];
  DATA.groups.forEach(g => {
    const yes = g.items.filter(it => state[it.id]?.v === "yes");
    const chg = g.items.filter(it => state[it.id]?.v === "change");
    const no  = g.items.filter(it => state[it.id]?.v === "no");
    const emp = g.items.filter(it => !state[it.id]?.v);
    L.push("■ " + g.title + "  (کل " + g.items.length + " | می‌خواهم " + yes.length + " | با تغییر " + chg.length + " | نمی‌خواهم " + no.length + " | بی‌پاسخ " + emp.length + ")");
    if (yes.length) L.push("  می‌خواهم: " + yes.map(x => x.t).join(" / "));
    if (chg.length) chg.forEach(x => { const n = (state[x.id] && state[x.id].n) || ""; L.push("  با تغییر: " + x.t + (n ? " ← " + n : " ← بدون توضیح")); });
    if (no.length) L.push("  نمی‌خواهم: " + no.map(x => x.t).join(" / "));
    L.push("");
  });
  L.push("یادداشت: ۶ نوشتهٔ اسپم قدیمی (شرط‌بندی/کازینو) در هیچ حالتی بازگردانده نمی‌شود.");
  return L.join("\n");
}

function openResult(){
  const box = document.getElementById("result");
  box.classList.add("on");
  const txt = buildText();
  document.getElementById("resMeta").textContent = "مي‌توانید این نتیجه را کپی کنید یا فایلش را ذخیره کنید و برای مسعود بفرستید.";
  let body = "";
  DATA.groups.forEach(g => {
    const yes = g.items.filter(it => state[it.id]?.v === "yes");
    const chg = g.items.filter(it => state[it.id]?.v === "change");
    const no  = g.items.filter(it => state[it.id]?.v === "no");
    body += `<h3>${esc(g.title)}</h3>`;
    body += `<div style="font-size:12.5px;color:#6b7480">می‌خواهم ${fa(yes.length)} · با تغییر ${fa(chg.length)} · نمی‌خواهم ${fa(no.length)}</div>`;
    if (yes.length) body += `<ul>${yes.map(x => `<li>${esc(x.t)}</li>`).join("")}</ul>`;
    if (chg.length) body += `<ul>${chg.map(x => `<li><b>${esc(x.t)}</b> — ${esc((state[x.id] && state[x.id].n) || "بدون توضیح")}</li>`).join("")}</ul>`;
  });
  body += `<h3>متن آمادهٔ ارسال</h3><pre id="txtOut">${esc(txt)}</pre>`;
  document.getElementById("resBody").innerHTML = body;
  document.getElementById("goBtn").dataset.txt = "1";
  window.__txt = txt;
}
document.getElementById("goBtn").onclick = openResult;
document.getElementById("backBtn").onclick = () => document.getElementById("result").classList.remove("on");

function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); }

document.getElementById("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(window.__txt || buildText()); toast("کپی شد — در تلگرام بفرستید"); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = window.__txt || buildText(); document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove(); toast("کپی شد");
  }
};
document.getElementById("dlBtn").onclick = () => {
  const blob = new Blob([window.__txt || buildText()], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "انتخاب-محتوا.txt"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
};
document.getElementById("tgBtn").onclick = async () => {
  const txt = (window.__txt || buildText()).slice(0, 900);
  const url = "https://t.me/share/url?url=" + encodeURIComponent(location.href) + "&text=" + encodeURIComponent(txt);
  window.open(url, "_blank");
};
document.getElementById("resetBtn").onclick = () => {
  if (!confirm("همهٔ انتخاب‌ها پاک شود؟")) return;
  state = {}; save(); document.getElementById("result").classList.remove("on"); render();
};
</script>
</body>
